# ============================================================================
# TAKT — Docker Compose Test (E2E)
# Fichier : docker-compose.test.yml
# Étape : G2 — Stratégie CI/CD
# ============================================================================

version: '3.8'

services:
  # ------------------------------------------------------------
  # Base de données — PostgreSQL 16 (test)
  # ------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: takt-postgres-test
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=takt_test
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d takt_test']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - takt-test-network

  # ------------------------------------------------------------
  # Backend — NestJS API (test)
  # ------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: runner
    container_name: takt-backend-test
    command: >-
      sh -c "cd /app/packages/db && ./node_modules/.bin/prisma migrate deploy
      && cd /app/apps/backend && node dist/main.js"
    environment:
      - NODE_ENV=test
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/takt_test
      - JWT_KEYS_DIRECTORY=/run/secrets/jwt
      - JWT_ACTIVE_KEY_ID=active
      - JWT_PREVIOUS_KEY_IDS=
      - JWT_ISSUER=takt-test
      - JWT_AUDIENCE=takt-api
      - JWT_ACCESS_TTL=15m
      - JWT_REFRESH_TTL=7d
      - SMTP_HOST=mock-smtp
      - SMTP_PORT=1025
      - SMTP_USER=test
      - SMTP_PASSWORD=test
      - DERIVED_DIR=/tmp/derived
      - SCENARIOS_DIR=/tmp/scenarios
      - SOLVER_COMMAND=echo "mock solver"
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - takt-test-network
    volumes:
      - ./secrets/jwt:/run/secrets/jwt:ro

  # ------------------------------------------------------------
  # Frontend — React + Vite (test, served by Nginx)
  # ------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: runner
    container_name: takt-frontend-test
    environment:
      - NODE_ENV=test
    ports:
      - '8080:80'
    depends_on:
      - backend
    networks:
      - takt-test-network
    volumes: []

  # ------------------------------------------------------------
  # Mock SMTP (pour tests notifications)
  # ------------------------------------------------------------
  mock-smtp:
    image: mailhog/mailhog:v1.0.1
    container_name: takt-mock-smtp-test
    ports:
      - '1025:1025'
      - '8025:8025'
    networks:
      - takt-test-network

networks:
  takt-test-network:
    driver: bridge
