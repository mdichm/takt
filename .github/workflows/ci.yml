# ============================================================================
# TAKT — Pipeline d'Intégration Continue (CI)
# Fichier : .github/workflows/ci.yml
# Étape : G2 — Stratégie CI/CD
# Déclencheur : Push sur develop, Pull Request prête pour revue vers develop
# ============================================================================

name: CI — TAKT

on:
  push:
    branches: ['develop']
  pull_request:
    types: [ready_for_review, synchronize]
    branches: ['develop', 'main']

env:
  NODE_VERSION: '24'
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/takt_test

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ------------------------------------------------------------
  # LINT & TYPECHECK
  # ------------------------------------------------------------
  lint-and-typecheck:
    name: Lint + TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Le client Prisma est généré : `@takt/db/src/index.ts` réexporte
      # `PrismaClient`, dont les types n'existent qu'après génération.
      - name: Prisma Generate
        run: pnpm --filter @takt/db db:generate

      - name: Lint (ESLint)
        run: pnpm lint

      - name: TypeCheck (TypeScript)
        run: pnpm typecheck
  # ------------------------------------------------------------
  # TESTS UNITAIRES + INTÉGRATION
  # ------------------------------------------------------------
  test:
    name: Tests (Unit + Intégration)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: takt_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma Generate
        run: pnpm --filter @takt/db db:generate

      # Déployer la migration versionnée, reproduisant la recette et la production.
      - name: Apply Prisma Migrations (test DB)
        run: pnpm --filter @takt/db db:migrate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run Unit Tests
        run: pnpm test:unit
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run Integration Tests
        run: pnpm test:integration
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  # ------------------------------------------------------------
  # BUILD (Backend + Frontend)
  # ------------------------------------------------------------
  build:
    name: Build Applications
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint-and-typecheck, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma Generate
        run: pnpm --filter @takt/db db:generate

      # Turbo construit les packages de workspace dans l'ordre des dependances
      # (contracts, design-tokens, db, solver-client) avant les applications.
      - name: Build All Applications (Turbo)
        run: pnpm build

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: apps/backend/dist/
          retention-days: 1

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist/
          retention-days: 1
  # ------------------------------------------------------------
  # DOCKER BUILD (Validation des images)
  # ------------------------------------------------------------
  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: takt_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: apps/backend/dist/

      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist/

      - name: Build Backend Docker Image
        run: |
          docker build -t takt/backend:${{ github.sha }} -f apps/backend/Dockerfile .

      - name: Build Frontend Docker Image
        run: |
          docker build -t takt/frontend:${{ github.sha }} -f apps/frontend/Dockerfile .

      - name: Test Backend Image Starts
        run: |
          docker run --rm -d --name backend-test --network host \
            -e DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/takt_test \
            -e JWT_KEYS_DIRECTORY=/run/secrets/jwt \
            -e JWT_ACTIVE_KEY_ID=active \
            -e JWT_ISSUER=takt-test \
            -e JWT_AUDIENCE=takt-api \
            takt/backend:${{ github.sha }}
          sleep 10
          curl -f http://localhost:3000/health || (docker logs backend-test && exit 1)
          docker stop backend-test

      - name: Test Frontend Image Starts
        run: |
          docker run --rm -d --name frontend-test -p 8080:80 takt/frontend:${{ github.sha }}
          sleep 5
          curl -f http://localhost:8080/ || (docker logs frontend-test && exit 1)
          docker stop frontend-test

  # ------------------------------------------------------------
  # TESTS E2E (Playwright)
  # ------------------------------------------------------------
  e2e:
    name: Tests E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: docker-build
    # Pas de service PostgreSQL ici : la stack docker-compose.test.yml fournit
    # sa propre base (interne au reseau du compose, sans port publie).
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm --filter @takt/frontend exec playwright install --with-deps chromium

      - name: Generate JWT Test Keys
        run: |
          mkdir -p secrets/jwt
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out secrets/jwt/active.private.pem 2>/dev/null
          openssl pkey -in secrets/jwt/active.private.pem -pubout -out secrets/jwt/active.public.pem 2>/dev/null

      - name: Start Full Stack (Docker Compose)
        run: |
          docker compose -f docker-compose.test.yml up -d
          sleep 20

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -f http://localhost:3000/health; then
              echo "Backend prêt"
              break
            fi
            sleep 2
          done
          curl -f http://localhost:3000/health

      - name: Run E2E Tests
        run: pnpm --filter @takt/frontend test:e2e
        env:
          BASE_URL: http://localhost:8080
          API_URL: http://localhost:3000/api/v1

      - name: Upload E2E Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            apps/frontend/playwright-report/
            apps/frontend/test-results/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  # ------------------------------------------------------------
  # CONTRAT OPENAPI
  # ------------------------------------------------------------
  check-openapi:
    name: Check OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma Generate
        run: pnpm --filter @takt/db db:generate

      - name: Vérifier le contrat OpenAPI
        run: pnpm check-openapi

  # ------------------------------------------------------------
  # ARCHITECTURE MODULAIRE
  # ------------------------------------------------------------
  check-module-dependencies:
    name: Check Module Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Le client Prisma est généré : `@takt/backend` (compilé par ce job)
      # importe `@takt/db`, dont les types n'existent qu'après génération.
      - name: Prisma Generate
        run: pnpm --filter @takt/db db:generate

      - name: Vérifier les dépendances entre modules
        run: pnpm check-module-dependencies

  # ------------------------------------------------------------
  # ACCESSIBILITÉ (axe-core) — job bloquant pour la protection de develop
  # ------------------------------------------------------------
  accessibility:
    name: Accessibilité (axe-core)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Unit Accessibility Tests (tokens + components)
        run: pnpm --filter @takt/frontend test:a11y:unit

      - name: Upload Axe Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axe-report
          path: apps/frontend/axe-results/
          retention-days: 7

  # ------------------------------------------------------------
  # CHECK REQUIS POUR LA PROTECTION DE develop
  # ------------------------------------------------------------
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs:
      [lint-and-typecheck, test, build, docker-build, e2e, check-openapi, check-module-dependencies, accessibility]
    if: always()
    steps:
      - name: Vérifier le résultat de la CI
        run: |
          if [[ "${{ needs.lint-and-typecheck.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.docker-build.result }}" != "success" ]] || \
             [[ "${{ needs.e2e.result }}" != "success" ]] || \
             [[ "${{ needs.check-openapi.result }}" != "success" ]] || \
             [[ "${{ needs.check-module-dependencies.result }}" != "success" ]] || \
             [[ "${{ needs.accessibility.result }}" != "success" ]]; then
            echo "La CI comporte au moins un job en échec."
            exit 1
          fi
