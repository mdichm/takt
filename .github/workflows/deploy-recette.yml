# ============================================================================
# TAKT — Déploiement de la recette éphémère
# Déclencheur : Push sur main uniquement
# La stack est démarrée sur le runner GitHub-hosted puis détruite à la fin.
# ============================================================================

name: Deploy Recette — TAKT

on:
  push:
    branches: ['main']

jobs:
  deploy-recette:
    name: Deploy Recette
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: recette
    env:
      POSTGRES_USER: takt
      POSTGRES_DB: takt_recette
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Générer les secrets temporaires
        shell: bash
        run: |
          umask 077
          mkdir -p secrets
          postgres_password="$(openssl rand -hex 32)"
          smtp_password="$(openssl rand -hex 32)"
          printf '%s' "${postgres_password}" > secrets/postgres_password.txt
          mkdir -p secrets/jwt
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out secrets/jwt/active.private.pem 2>/dev/null
          openssl pkey -in secrets/jwt/active.private.pem -pubout -out secrets/jwt/active.public.pem 2>/dev/null
          echo "POSTGRES_PASSWORD=${postgres_password}" >> "${GITHUB_ENV}"
          echo "DATABASE_URL=postgresql://${POSTGRES_USER}:${postgres_password}@postgres:5432/${POSTGRES_DB}" >> "${GITHUB_ENV}"
          echo "SMTP_PASSWORD=${smtp_password}" >> "${GITHUB_ENV}"

      - name: Construire la stack de recette
        run: docker compose -f docker-compose.recette.yml build

      - name: Démarrer la stack de recette
        run: docker compose -f docker-compose.recette.yml up -d --wait --wait-timeout 180

      - name: Vérifier les healthchecks
        run: |
          docker compose -f docker-compose.recette.yml ps
          curl --fail --silent --show-error http://localhost:3000/health
          curl --fail --silent --show-error http://localhost:8080/health

      - name: Exécuter les smoke tests
        run: |
          curl --fail --silent --show-error http://localhost:8080/accueil | grep -q '<div id="root">'

      - name: Nettoyer la stack de recette
        if: always()
        run: docker compose -f docker-compose.recette.yml down -v --remove-orphans
