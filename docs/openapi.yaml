components:
  responses:
    '400':
      content:
        application/json:
          example:
            code: VALIDATION_ERROR
          schema:
            $ref: '#/components/schemas/ErreurApi'
      description: Requête invalide
    '401':
      content:
        application/json:
          example:
            code: UNAUTHORIZED
          schema:
            $ref: '#/components/schemas/ErreurApi'
      description: Non authentifié
    '403':
      content:
        application/json:
          example:
            code: FORBIDDEN
          schema:
            $ref: '#/components/schemas/ErreurApi'
      description: Interdit
    '404':
      content:
        application/json:
          example:
            code: NOT_FOUND
          schema:
            $ref: '#/components/schemas/ErreurApi'
      description: Ressource non trouvée
    '409':
      content:
        application/json:
          example:
            code: WORKFLOW_INVALID_TRANSITION
          schema:
            $ref: '#/components/schemas/ErreurApi'
      description: Conflit
    '423':
      content:
        application/json:
          example:
            code: SEANCE_LOCKED
          schema:
            $ref: '#/components/schemas/ErreurApi'
      description: Ressource verrouillée
    '429':
      content:
        application/json:
          example:
            code: RATE_LIMITED
          schema:
            $ref: '#/components/schemas/ErreurApi'
      description: Trop de requêtes
    '500':
      content:
        application/json:
          example:
            code: INTERNAL_ERROR
          schema:
            $ref: '#/components/schemas/ErreurApi'
      description: Erreur interne
  schemas:
    AffectationPedagogique:
      properties:
        createdAt:
          format: date-time
          type: string
        departementId:
          format: uuid
          type: string
        enseignantId:
          format: uuid
          type: string
        groupeId:
          format: uuid
          type: string
        id:
          format: uuid
          type: string
        matiereId:
          format: uuid
          type: string
        semestreId:
          format: uuid
          type: string
        updatedAt:
          format: date-time
          type: string
        volumeHoraire:
          type: integer
      required:
        - id
        - semestreId
        - departementId
        - enseignantId
        - matiereId
        - groupeId
        - volumeHoraire
        - createdAt
        - updatedAt
      type: object
    AnneeUniversitaire:
      properties:
        dateDebut:
          format: date-time
          type: string
        dateFin:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        libelle:
          type: string
      required:
        - id
        - libelle
        - dateDebut
        - dateFin
      type: object
    Contrainte:
      properties:
        cibleId:
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        type:
          enum:
            - INDISPONIBILITE
            - EXIGENCE_SALLE
            - CONTRAINTE_ENSEIGNANT
          type: string
        valeur:
          type: string
        versionId:
          format: uuid
          type: string
      required:
        - id
        - versionId
        - type
        - cibleId
        - valeur
        - createdAt
      type: object
    Departement:
      properties:
        code:
          type: string
        id:
          format: uuid
          type: string
        libelle:
          type: string
      required:
        - id
        - code
        - libelle
      type: object
    EnveloppeReponse:
      properties:
        data:
          description: Données de la réponse (null en cas d'erreur)
        error:
          $ref: '#/components/schemas/ErreurRFC9457'
          nullable: true
        meta:
          $ref: '#/components/schemas/MetaReponse'
      required:
        - data
        - error
        - meta
      type: object
    ErreurApi:
      properties:
        code:
          enum:
            - VALIDATION_ERROR
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - WORKFLOW_INVALID_TRANSITION
            - SEANCE_LOCKED
            - RATE_LIMITED
            - INTERNAL_ERROR
          type: string
        details:
          items:
            type: object
          type: array
        message:
          type: string
      required:
        - code
      type: object
    ErreurRFC9457:
      properties:
        detail:
          description: Description détaillée de l'erreur
          example: Le champ email est requis.
          type: string
        instance:
          description: URI spécifique à l'occurrence de l'erreur
          example: /api/v1/users/123
          type: string
        status:
          description: Code HTTP de l'erreur
          example: 400
          type: integer
        title:
          description: Titre court et lisible de l'erreur
          example: Erreur de validation
          type: string
        type:
          description: URI d'identification du type d'erreur
          example: https://api.takt.internal/errors/validation-error
          type: string
      required:
        - type
        - title
        - status
        - detail
      type: object
    Export:
      properties:
        cheminFichier:
          type: string
        dateGeneration:
          format: date-time
          type: string
        format:
          enum:
            - xlsx
            - pdf
            - ics
          type: string
        id:
          format: uuid
          type: string
        versionId:
          format: uuid
          type: string
      required:
        - id
        - versionId
        - format
        - cheminFichier
        - dateGeneration
      type: object
    ExportRequest:
      properties:
        format:
          enum:
            - xlsx
            - pdf
            - ics
          type: string
        versionId:
          format: uuid
          type: string
      required:
        - versionId
        - format
      type: object
    ExportResponse:
      allOf:
        - $ref: '#/components/schemas/Export'
    Generation:
      properties:
        createdAt:
          format: date-time
          type: string
        fichierDerivesId:
          format: uuid
          nullable: true
          type: string
        id:
          format: uuid
          type: string
        scores:
          description: score_global et sous_scores
          type: object
        statut:
          enum:
            - EN_COURS
            - TERMINEE
            - ECHEC
          type: string
        versionId:
          format: uuid
          type: string
      required:
        - id
        - versionId
        - statut
        - createdAt
      type: object
    GenerationRequest:
      properties:
        versionId:
          format: uuid
          type: string
      required:
        - versionId
      type: object
    GenerationResponse:
      allOf:
        - $ref: '#/components/schemas/Generation'
    Grade:
      properties:
        code:
          type: string
        couleur:
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        libelle:
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - code
        - libelle
        - couleur
        - createdAt
        - updatedAt
      type: object
    GradeCreateRequest:
      properties:
        code:
          type: string
        libelle:
          type: string
      required:
        - code
        - libelle
      type: object
    GradeTypeEnseignement:
      properties:
        createdAt:
          format: date-time
          type: string
        gradeId:
          format: uuid
          type: string
        id:
          format: uuid
          type: string
        typeEnseignementId:
          format: uuid
          type: string
      required:
        - id
        - gradeId
        - typeEnseignementId
        - createdAt
      type: object
    GradeTypeEnseignementCreateRequest:
      properties:
        gradeId:
          format: uuid
          type: string
        typeEnseignementId:
          format: uuid
          type: string
      required:
        - gradeId
        - typeEnseignementId
      type: object
    GradeUpdateRequest:
      properties:
        code:
          type: string
        libelle:
          type: string
      type: object
    HealthStatusDto:
      properties:
        status:
          description: État de l'API
          example: ok
          type: string
        uptime:
          description: Durée de fonctionnement en secondes
          example: 1234
          type: number
        version:
          description: Version de l’API
          example: 1.0.0
          type: string
      required:
        - status
        - uptime
        - version
      type: object
    JournalAudit:
      properties:
        action:
          type: string
        entite:
          type: string
        entiteId:
          nullable: true
          type: string
        horodatage:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        metadonnees:
          nullable: true
          type: object
        utilisateurId:
          format: uuid
          nullable: true
          type: string
      required:
        - id
        - action
        - horodatage
        - entite
      type: object
    LockRequest:
      properties:
        seanceId:
          format: uuid
          type: string
        type:
          enum:
            - CRENEAU
            - SALLE
            - ENSEIGNANT
            - ACTIVITE
          type: string
      required:
        - seanceId
        - type
      type: object
    LoginRequest:
      properties:
        email:
          format: email
          type: string
        motDePasse:
          format: password
          type: string
      required:
        - email
        - motDePasse
      type: object
    Matiere:
      properties:
        code:
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        libelle:
          type: string
        moduleId:
          format: uuid
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - code
        - libelle
        - moduleId
        - createdAt
        - updatedAt
      type: object
    MatiereCreateRequest:
      properties:
        code:
          type: string
        libelle:
          type: string
        moduleId:
          format: uuid
          type: string
      required:
        - code
        - libelle
        - moduleId
      type: object
    MatiereUpdateRequest:
      properties:
        code:
          type: string
        libelle:
          type: string
        moduleId:
          format: uuid
          type: string
      type: object
    MetaReponse:
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        requestId:
          format: uuid
          type: string
        timestamp:
          format: date-time
          type: string
        total:
          type: integer
      type: object
    Module:
      properties:
        code:
          type: string
        createdAt:
          format: date-time
          type: string
        gradeId:
          format: uuid
          type: string
        id:
          format: uuid
          type: string
        libelle:
          type: string
        typeEnseignementId:
          format: uuid
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - code
        - libelle
        - typeEnseignementId
        - gradeId
        - createdAt
        - updatedAt
      type: object
    ModuleCreateRequest:
      properties:
        code:
          type: string
        gradeId:
          format: uuid
          type: string
        libelle:
          type: string
        typeEnseignementId:
          format: uuid
          type: string
      required:
        - code
        - libelle
        - typeEnseignementId
        - gradeId
      type: object
    ModuleUpdateRequest:
      properties:
        code:
          type: string
        gradeId:
          format: uuid
          type: string
        libelle:
          type: string
        typeEnseignementId:
          format: uuid
          type: string
      type: object
    RefreshRequest:
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
      type: object
    Role:
      properties:
        code:
          enum:
            - admin
            - gest
            - rdep
            - dir
          type: string
        id:
          format: uuid
          type: string
        libelle:
          type: string
      required:
        - id
        - code
        - libelle
      type: object
    Scenario:
      properties:
        createdAt:
          format: date-time
          type: string
        generationId:
          format: uuid
          type: string
        id:
          format: uuid
          type: string
        scoreGlobal:
          maximum: 100
          minimum: 0
          type: integer
        selectionne:
          type: boolean
        sousScores:
          description: Sous-scores détaillés (respect créneaux, salles, enseignants, couverture)
          type: object
      required:
        - id
        - generationId
        - scoreGlobal
        - sousScores
        - selectionne
        - createdAt
      type: object
    ScenarioResponse:
      allOf:
        - $ref: '#/components/schemas/Scenario'
    ScenarioSelectRequest:
      properties:
        scenarioId:
          format: uuid
          type: string
      required:
        - scenarioId
      type: object
    Seance:
      properties:
        activiteId:
          format: uuid
          nullable: true
          type: string
        createdAt:
          format: date-time
          type: string
        creneauDebut:
          description: Index du créneau (0-based par jour)
          minimum: 0
          type: integer
        enseignantId:
          format: uuid
          nullable: true
          type: string
        estVerrouillee:
          type: boolean
        groupeId:
          format: uuid
          nullable: true
          type: string
        id:
          format: uuid
          type: string
        jour:
          description: 1=lundi … 6=samedi
          maximum: 6
          minimum: 1
          type: integer
        nbCreneaux:
          description: Nombre de créneaux consécutifs
          minimum: 1
          type: integer
        salleId:
          format: uuid
          nullable: true
          type: string
        updatedAt:
          format: date-time
          type: string
        versionId:
          format: uuid
          type: string
      required:
        - id
        - versionId
        - jour
        - creneauDebut
        - nbCreneaux
        - estVerrouillee
        - createdAt
        - updatedAt
      type: object
    SeanceCreateRequest:
      properties:
        activiteId:
          format: uuid
          nullable: true
          type: string
        creneauDebut:
          minimum: 0
          type: integer
        enseignantId:
          format: uuid
          nullable: true
          type: string
        groupeId:
          format: uuid
          nullable: true
          type: string
        jour:
          maximum: 6
          minimum: 1
          type: integer
        nbCreneaux:
          minimum: 1
          type: integer
        salleId:
          format: uuid
          nullable: true
          type: string
        versionId:
          format: uuid
          type: string
      required:
        - versionId
        - jour
        - creneauDebut
        - nbCreneaux
      type: object
    SeanceResponse:
      allOf:
        - $ref: '#/components/schemas/Seance'
    SeanceUpdateRequest:
      properties:
        activiteId:
          format: uuid
          nullable: true
          type: string
        creneauDebut:
          minimum: 0
          type: integer
        enseignantId:
          format: uuid
          nullable: true
          type: string
        groupeId:
          format: uuid
          nullable: true
          type: string
        jour:
          maximum: 6
          minimum: 1
          type: integer
        nbCreneaux:
          minimum: 1
          type: integer
        salleId:
          format: uuid
          nullable: true
          type: string
      type: object
    Semestre:
      properties:
        anneeUniversitaireId:
          format: uuid
          type: string
        dateDebut:
          format: date-time
          type: string
        dateFin:
          type: string
        id:
          format: uuid
          type: string
        numero:
          enum:
            - 1
            - 2
          type: integer
      required:
        - id
        - numero
        - anneeUniversitaireId
        - dateDebut
        - dateFin
      type: object
    Snapshot:
      properties:
        createdAt:
          format: date-time
          type: string
        donnees:
          description: Données JSONB du snapshot
          type: object
        hash:
          description: Hash d'intégrité du snapshot
          type: string
        id:
          format: uuid
          type: string
        versionId:
          format: uuid
          type: string
      required:
        - id
        - versionId
        - donnees
        - hash
        - createdAt
      type: object
    TokenResponse:
      properties:
        accessToken:
          description: JWT d'accès (durée 15 min)
          type: string
        refreshToken:
          description: JWT de refresh rotatif (durée 7 j)
          type: string
      required:
        - accessToken
        - refreshToken
      type: object
    TransitionRequest:
      properties:
        transition:
          description: 'Nom de la transition du workflow (ex: valider_repartition, lancer_generation)'
          type: string
      required:
        - transition
      type: object
    TypeEnseignement:
      properties:
        code:
          type: string
        couleur:
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        libelle:
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - code
        - libelle
        - couleur
        - createdAt
        - updatedAt
      type: object
    TypeEnseignementCreateRequest:
      properties:
        code:
          type: string
        couleur:
          type: string
        libelle:
          type: string
      required:
        - code
        - libelle
        - couleur
      type: object
    TypeEnseignementUpdateRequest:
      properties:
        code:
          type: string
        couleur:
          type: string
        libelle:
          type: string
      type: object
    Utilisateur:
      properties:
        createdAt:
          format: date-time
          type: string
        departementId:
          format: uuid
          nullable: true
          type: string
        email:
          format: email
          type: string
        estActif:
          type: boolean
        id:
          format: uuid
          type: string
        nom:
          type: string
        prenom:
          type: string
        roleId:
          format: uuid
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - email
        - nom
        - prenom
        - roleId
        - estActif
        - createdAt
        - updatedAt
      type: object
    UtilisateurResponse:
      allOf:
        - $ref: '#/components/schemas/Utilisateur'
    VerrouSeance:
      properties:
        heureExpiration:
          format: date-time
          type: string
        heurePose:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        seanceId:
          format: uuid
          type: string
        type:
          enum:
            - CRENEAU
            - SALLE
            - ENSEIGNANT
            - ACTIVITE
          type: string
        utilisateurId:
          format: uuid
          type: string
      required:
        - id
        - seanceId
        - utilisateurId
        - type
        - heurePose
        - heureExpiration
      type: object
    Version:
      properties:
        createdAt:
          format: date-time
          type: string
        etat:
          enum:
            - initial
            - rep_pedag
            - brouillon
            - generation
            - edition
            - valid_pedag
            - valid_dir
            - valide
            - publie
            - archive
          type: string
        id:
          format: uuid
          type: string
        semestreId:
          format: uuid
          type: string
        snapshotId:
          format: uuid
          nullable: true
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - semestreId
        - etat
        - createdAt
        - updatedAt
      type: object
    VersionResponse:
      allOf:
        - $ref: '#/components/schemas/Version'
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  contact: {}
  description: API de planification et gestion des emplois du temps pédagogiques
  license:
    name: GNU AGPL v3
    url: https://www.gnu.org/licenses/agpl-3.0.html
  title: TAKT API
  version: 1.0.0
openapi: 3.0.0
paths:
  /api/v1/affectations:
    get:
      operationId: AffectationPedagogiqueController_list
      parameters: []
      responses:
        '200':
          description: Liste des affectations pédagogiques
        '401':
          description: Non authentifié
        '403':
          description: Interdit
      security:
        - bearerAuth: []
      summary: Liste paginée des affectations pédagogiques
      tags:
        - Répartition
    post:
      operationId: AffectationPedagogiqueController_creer
      parameters: []
      responses:
        '201':
          description: Affectation pédagogique créée
        '400':
          description: Requête invalide
        '401':
          description: Non authentifié
        '403':
          description: Interdit
        '404':
          description: Version ou ressource introuvable
        '409':
          description: Conflit (triplet déjà affecté)
      security:
        - bearerAuth: []
      summary: Crée une affectation pédagogique
      tags:
        - Répartition
  /api/v1/affectations/cascade:
    post:
      operationId: AffectationPedagogiqueController_creerCascade
      parameters: []
      responses:
        '201':
          description: Affectations créées en cascade
        '400':
          description: Requête invalide
        '401':
          description: Non authentifié
        '403':
          description: Interdit
        '404':
          description: Ressource introuvable
        '409':
          description: Conflit (triplet déjà affecté)
      security:
        - bearerAuth: []
      summary: Crée des affectations en cascade depuis un plan d’études
      tags:
        - Répartition
  /api/v1/affectations/{id}:
    delete:
      operationId: AffectationPedagogiqueController_supprimer
      parameters: []
      responses:
        '200':
          description: Affectation pédagogique supprimée
        '401':
          description: Non authentifié
        '403':
          description: Interdit
        '404':
          description: Affectation pédagogique introuvable
      security:
        - bearerAuth: []
      summary: Supprime une affectation pédagogique
      tags:
        - Répartition
    get:
      operationId: AffectationPedagogiqueController_getOne
      parameters: []
      responses:
        '200':
          description: Affectation pédagogique trouvée
        '401':
          description: Non authentifié
        '403':
          description: Interdit ou hors périmètre
        '404':
          description: Affectation pédagogique introuvable
      security:
        - bearerAuth: []
      summary: Détail d’une affectation pédagogique
      tags:
        - Répartition
    patch:
      operationId: AffectationPedagogiqueController_mettreAJour
      parameters: []
      responses:
        '200':
          description: Affectation pédagogique modifiée
        '400':
          description: Requête invalide
        '401':
          description: Non authentifié
        '403':
          description: Interdit
        '404':
          description: Affectation pédagogique introuvable
        '409':
          description: Conflit (triplet déjà affecté)
      security:
        - bearerAuth: []
      summary: Modifie une affectation pédagogique
      tags:
        - Répartition
  /api/v1/auth/login:
    post:
      operationId: AuthController_login
      parameters: []
      responses:
        '200':
          description: Connexion réussie
        '401':
          description: Identifiants invalides
        '429':
          description: Trop de tentatives
      security:
        - bearerAuth: []
      summary: Connexion utilisateur (émet access + refresh)
      tags:
        - auth
  /api/v1/auth/logout:
    post:
      operationId: AuthController_logout
      parameters: []
      responses:
        '200':
          description: Déconnecté
        '401':
          description: Refresh token invalide
      security:
        - bearerAuth: []
      summary: Déconnexion (révoque la famille de rafraîchissement)
      tags:
        - auth
  /api/v1/auth/refresh:
    post:
