          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Liste des entrées d'audit
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnveloppeReponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/JournalAudit'
        '400':
          description: Paramètres invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurRFC9457'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurRFC9457'
        '403':
          description: Interdit (droits insuffisants)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurRFC9457'
          format: date-time