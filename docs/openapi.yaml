openapi: 3.0.0
info:
  title: TAKT API
  version: 1.0.0
  description: |
    API de l'application TAKT — Planification et gestion des emplois du temps pédagogiques.
    Conforme à la spécification technique docs/ST_TAKT.md (étape E0.6).
    Authentification par Bearer JWT (access token 15 min + refresh token rotatif 7 j).
  contact:
    name: Équipe TAKT
    email: dev@takt.internal
  license:
    name: GNU AGPL v3
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: http://localhost:3000/api/v1
    description: Serveur de développement (NestJS local)
  - url: https://api.takt.internal/api/v1
    description: Serveur de production (Nginx reverse proxy)

tags:
  - name: Auth
    description: Authentification et gestion de session
  - name: Utilisateurs
    description: Gestion des comptes utilisateurs (CRUD)
  - name: Versions
    description: Gestion des versions de planning et workflow (10 états, 19 transitions)
  - name: Seances
    description: Gestion des séances de cours (CRUD, détection de conflits)
  - name: Verrous
    description: Gestion des baux d'édition sur les séances
  - name: Generations
    description: Génération d'emplois du temps par CP-SAT et scénarios
  - name: Exports
    description: Génération d'exports (XLSX, PDF, ICS)
  - name: Audit
    description: Journal d'audit des actions utilisateurs

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token d'accès JWT obtenu via POST /auth/login.
        Durée de vie : 15 minutes. Renouvelable via POST /auth/refresh.

  schemas:
    ErreurRFC9457:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          description: URI d'identification du type d'erreur
          example: https://api.takt.internal/errors/validation-error
        title:
          type: string
          description: Titre court et lisible de l'erreur
          example: Erreur de validation
        status:
          type: integer
          description: Code HTTP de l'erreur
          example: 400
        detail:
          type: string
          description: Description détaillée de l'erreur
          example: Le champ email est requis.
        instance:
          type: string
          description: URI spécifique à l'occurrence de l'erreur
          example: /api/v1/users/123

    EnveloppeReponse:
      type: object
      required:
        - data
        - error
        - meta
      properties:
        data:
          description: Données de la réponse (null en cas d'erreur)
        error:
          $ref: '#/components/schemas/ErreurRFC9457'
          nullable: true
        meta:
          $ref: '#/components/schemas/MetaReponse'

    MetaReponse:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    Utilisateur:
      type: object
      required:
        - id
        - email
        - nom
        - prenom
        - roleId
        - estActif
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        nom:
          type: string
        prenom:
          type: string
        roleId:
          type: string
          format: uuid
        departementId:
          type: string
          format: uuid
          nullable: true
        estActif:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Role:
      type: object
      required:
        - id
        - code
        - libelle
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          enum: [admin, gest, rdep, dir]
        libelle:
          type: string

    Departement:
      type: object
      required:
        - id
        - code
        - libelle
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        libelle:
          type: string

    AnneeUniversitaire:
      type: object
      required:
        - id
        - libelle
        - dateDebut
        - dateFin
      properties:
        id:
          type: string
          format: uuid
        libelle:
          type: string
        dateDebut:
          type: string
          format: date-time
        dateFin:
          type: string
          format: date-time

    Semestre:
      type: object
      required:
        - id
        - numero
        - anneeUniversitaireId
        - dateDebut
        - dateFin
      properties:
        id:
          type: string
          format: uuid
        numero:
          type: integer
          enum: [1, 2]
        anneeUniversitaireId:
          type: string
          format: uuid
        dateDebut:
          type: string
          format: date-time
        dateFin:
          type: string

    Version:
      type: object
      required:
        - id
        - semestreId
        - etat
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        semestreId:
          type: string
          format: uuid
        etat:
          type: string
          enum: [initial, rep_pedag, brouillon, generation, edition, valid_pedag, valid_dir, valide, publie, archive]
        snapshotId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Snapshot:
      type: object
      required:
        - id
        - versionId
        - donnees
        - hash
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
        donnees:
          type: object
          description: Données JSONB du snapshot
        hash:
          type: string
          description: Hash d'intégrité du snapshot
        createdAt:
          type: string
          format: date-time

    AffectationPedagogique:
      type: object
      required:
        - id
        - semestreId
        - departementId
        - enseignantId
        - matiereId
        - groupeId
        - volumeHoraire
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        semestreId:
          type: string
          format: uuid
        departementId:
          type: string
          format: uuid
        enseignantId:
          type: string
          format: uuid
        matiereId:
          type: string
          format: uuid
        groupeId:
          type: string
          format: uuid
        volumeHoraire:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Seance:
      type: object
      required:
        - id
        - versionId
        - jour
        - creneauDebut
        - nbCreneaux
        - estVerrouillee
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
        jour:
          type: integer
          minimum: 1
          maximum: 6
          description: 1=lundi … 6=samedi
        creneauDebut:
          type: integer
          minimum: 0
          description: Index du créneau (0-based par jour)
        nbCreneaux:
          type: integer
          minimum: 1
          description: Nombre de créneaux consécutifs
        salleId:
          type: string
          format: uuid
          nullable: true
        enseignantId:
          type: string
          format: uuid
          nullable: true
        groupeId:
          type: string
          format: uuid
          nullable: true
        activiteId:
          type: string
          format: uuid
          nullable: true
        estVerrouillee:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    VerrouSeance:
      type: object
      required:
        - id
        - seanceId
        - utilisateurId
        - type
        - heurePose
        - heureExpiration
      properties:
        id:
          type: string
          format: uuid
        seanceId:
          type: string
          format: uuid
        utilisateurId:
          type: string
          format: uuid
        type:
          type: string
          enum: [CRENEAU, SALLE, ENSEIGNANT, ACTIVITE]
        heurePose:
          type: string
          format: date-time
        heureExpiration:
          type: string
          format: date-time

    Contrainte:
      type: object
      required:
        - id
        - versionId
        - type
        - cibleId
        - valeur
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
        type:
          type: string
          enum: [INDISPONIBILITE, EXIGENCE_SALLE, CONTRAINTE_ENSEIGNANT]
        cibleId:
          type: string
        valeur:
          type: string
        createdAt:
          type: string
          format: date-time

    Generation:
      type: object
      required:
        - id
        - versionId
        - statut
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
        statut:
          type: string
          enum: [EN_COURS, TERMINEE, ECHEC]
        fichierDerivesId:
          type: string
          format: uuid
          nullable: true
        scores:
          type: object
          description: score_global et sous_scores
        createdAt:
          type: string
          format: date-time

    Scenario:
      type: object
      required:
        - id
        - generationId
        - scoreGlobal
        - sousScores
        - selectionne
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        generationId:
          type: string
          format: uuid
        scoreGlobal:
          type: integer
          minimum: 0
          maximum: 100
        sousScores:
          type: object
          description: Sous-scores détaillés (respect créneaux, salles, enseignants, couverture)
        selectionne:
          type: boolean
        createdAt:
          type: string
          format: date-time

    Export:
      type: object
      required:
        - id
        - versionId
        - format
        - cheminFichier
        - dateGeneration
      properties:
        id:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
        format:
          type: string
          enum: [xlsx, pdf, ics]
        cheminFichier:
          type: string
        dateGeneration:
          type: string
          format: date-time

    JournalAudit:
      type: object
      required:
        - id
        - action
        - horodatage
        - entite
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
        horodatage:
          type: string
          format: date-time
        utilisateurId:
          type: string
          format: uuid
          nullable: true
        entite:
          type: string
        entiteId:
          type: string
          nullable: true
        metadonnees:
          type: object
          nullable: true

    # ------------------------------------------------------------------------
    # DTOs de demande (Request bodies)
    # ------------------------------------------------------------------------
    LoginRequest:
      type: object
      required:
        - email
        - motDePasse
      properties:
        email:
          type: string
          format: email
        motDePasse:
          type: string
          format: password

    RefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string

    TransitionRequest:
      type: object
      required:
        - transition
      properties:
        transition:
          type: string
          description: "Nom de la transition du workflow (ex: valider_repartition, lancer_generation)"

    SeanceCreateRequest:
      type: object
      required:
        - versionId
        - jour
        - creneauDebut
        - nbCreneaux
      properties:
        versionId:
          type: string
          format: uuid
        jour:
          type: integer
          minimum: 1
          maximum: 6
        creneauDebut:
          type: integer
          minimum: 0
        nbCreneaux:
          type: integer
          minimum: 1
        salleId:
          type: string
          format: uuid
          nullable: true
        enseignantId:
          type: string
          format: uuid
          nullable: true
        groupeId:
          type: string
          format: uuid
          nullable: true
        activiteId:
          type: string
          format: uuid
          nullable: true

    SeanceUpdateRequest:
      type: object
      properties:
        jour:
          type: integer
          minimum: 1
          maximum: 6
        creneauDebut:
          type: integer
          minimum: 0
        nbCreneaux:
          type: integer
          minimum: 1
        salleId:
          type: string
          format: uuid
          nullable: true
        enseignantId:
          type: string
          format: uuid
          nullable: true
        groupeId:
          type: string
          format: uuid
          nullable: true
        activiteId:
          type: string
          format: uuid
          nullable: true

    LockRequest:
      type: object
      required:
        - seanceId
        - type
      properties:
        seanceId:
          type: string
          format: uuid
        type:
          type: string
          enum: [CRENEAU, SALLE, ENSEIGNANT, ACTIVITE]

    GenerationRequest:
      type: object
      required:
        - versionId
      properties:
        versionId:
          type: string
          format: uuid

    ScenarioSelectRequest:
      type: object
      required:
        - scenarioId
      properties:
        scenarioId:
          type: string
          format: uuid

    ExportRequest:
      type: object
      required:
        - versionId
        - format
      properties:
        versionId:
          type: string
          format: uuid
        format:
          type: string
          enum: [xlsx, pdf, ics]

    # ------------------------------------------------------------------------
    # DTOs de réponse
    # ------------------------------------------------------------------------
    TokenResponse:
      type: object
      required:
        - accessToken
        - refreshToken
      properties:
        accessToken:
          type: string
          description: JWT d'accès (durée 15 min)
        refreshToken:
          type: string
          description: JWT de refresh rotatif (durée 7 j)

    UtilisateurResponse:
      allOf:
        - $ref: '#/components/schemas/Utilisateur'

    SeanceResponse:
      allOf:
        - $ref: '#/components/schemas/Seance'

    VersionResponse:
      allOf:
        - $ref: '#/components/schemas/Version'

    GenerationResponse:
      allOf:
        - $ref: '#/components/schemas/Generation'

    ScenarioResponse:
      allOf:
        - $ref: '#/components/schemas/Scenario'

    ExportResponse:
      allOf:
        - $ref: '#/components/schemas/Export'

paths:
  # ============================================================================
  # AUTH
  # ============================================================================
  /auth/login:
    post:
      tags: [Auth]
      summary: Connexion utilisateur
      description: Authentifie un utilisateur et retourne un access token + refresh token.
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnveloppeReponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Données de requête invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurRFC9457'
        '401':
          description: Identifiants invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurRFC9457'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renouvellement du token d'accès
      description: Renouvelle le token d'accès à l'aide du refresh token rotatif.
      operationId: authRefresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token renouvelé
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnveloppeReponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Requête invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurRFC9457'
        '401':
          description: Refresh token invalide ou expiré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurRFC9457'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Déconnexion
      description: Invalide le refresh token de la session courante.
      operationId: authLogout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Déconnexion réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnveloppeReponse'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurRFC9457'

  # ============================================================================
  # UTILISATEURS
  # ============================================================================
  /users:
    get:
      tags: [Utilisateurs]
      summary: Liste des utilisateurs
      description: Retourne la liste paginée des utilisateurs avec filtres optionnels.
      operationId: usersList
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
        - in: query
          name: role
          schema:
            type: string
            enum: [admin, gest, rdep, dir]
        - in: query
          name: departementId
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Liste des utilisateurs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnveloppeReponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/UtilisateurResponse'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurRFC9457'
        '403':
          description: Interdit (rôle insuffisant)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurRFC9457'

    post:
      tags: [Utilisateurs]
      summary: Créer un utilisateur
      description: Crée un nouveau compte utilisateur.
      operationId: usersCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - motDePasse
                - nom
                - prenom
                - roleId
              properties:
                email:
                  type: string
                  format: email
                motDePasse:
                  type: string
                  format: password
                nom:
                  type: string
                prenom:
                  type: string
                roleId:
                  type: string
                  format: uuid
                departementId:
                  type: string
                  format: uuid
                  nullable: true
      responses:
        '201':
          description: Utilisateur créé
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnveloppeReponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UtilisateurResponse'
        '400':
          description: Données invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurRFC9457'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurRFC9457'
        '403':
          description: Interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurRFC9457'

  /users/{id}:
    get:
      tags: [Utilisateurs]
      summary: Détail d'un utilisateur
      operationId: usersGet
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Détail utilisateur
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnveloppeReponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UtilisateurResponse'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurRFC9457'
        '403':
          description: Interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurRFC9457'
        '404':
          description: Utilisateur non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurRFC9457'

    put:
      tags: [Utilisateurs]
      summary: Modifier un utilisateur
      operationId: usersUpdate
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                nom:
                  type: string
                prenom:
                  type: string
                roleId:
                  type: string
                  format: uuid
                departementId:
                  type: string
                  format: uuid
                  nullable: true
                estActif:
                  type: boolean
      responses:
        '200':
          description: Utilisateur modifié
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnveloppeReponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UtilisateurResponse'
        '400':
          description: Données invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurRFC9457'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurRFC9457'
        '403':
          description: Interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurRFC9457'
        '404':
          description: Utilisateur non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurRFC9457'

    delete:
      tags: [Utilisateurs]
      summary: Supprimer un utilisateur
      operationId: usersDelete
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Utilisateur supprimé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnveloppeReponse'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurRFC9457'
        '403':
          description: Interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurRFC9457'
        '404':
          description: Utilisateur non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErreurRFC9457'

  # ============================================================================
  # VERSIONS
  # ============================================================================
  /versions:
    get:
      tags: [Versions]
      summary: Liste des versions
      description: Retourne la liste des versions de planning avec filtres.
      operationId: versionsList
      parameters:
        - in: query
          name: semestreId
          schema:
            type: string
            format: uuid
        - in: query
          name: etat
          schema:
            type: string
            enum: [initial, rep_pedag, brouillon, generation, edition, valid_pedag, valid_dir, valide, publie, archive]
        - in: query
          name: page
          schema:
